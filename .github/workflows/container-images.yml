name: container-images
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  security:
    uses: ./.github/workflows/dependency-security.yml
  verify:
    uses: ./.github/workflows/postgres-rds.yml
  runtime:
    uses: ./.github/workflows/app-platform-local.yml
  publish:
    needs: [security, verify, runtime]
    if: github.ref_name == github.event.repository.default_branch && vars.DEPLOYMENT_PROVIDER == 'digitalocean'
    environment: container-images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCR_REGISTRY: ${{ vars.DOCR_REGISTRY }}
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: "24"}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Validate registry configuration
        run: '[[ "$DOCR_REGISTRY" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]]'
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DOCR_USERNAME }}
          password: ${{ secrets.DOCR_WRITE_TOKEN }}
      - name: Build release candidates once (no push)
        run: |
          set -euo pipefail
          prefix="registry.digitalocean.com/$DOCR_REGISTRY"
          for service in api engine payments withdrawals backup; do
            case "$service" in
              api) context=app; file=app/Dockerfile; command='' ;;
              backup) context=deploy/portable/backup; file=deploy/portable/backup/Dockerfile; command='' ;;
              *) context=vp-engine; file=vp-engine/deployments/Dockerfile; command="vp-$service" ;;
            esac
            docker buildx build --load --platform linux/amd64 --provenance=false --target runtime \
              --build-arg "CMD=$command" --build-arg "COMMIT=$GITHUB_SHA" --build-arg "VERSION=$GITHUB_SHA" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              -t "$prefix/mindbliss-$service:$IMAGE_TAG" -f "$file" "$context"
            if [ "$service" = backup ]; then
              docker tag "$prefix/mindbliss-backup:$IMAGE_TAG" mindbliss/backup:infra-20261023
            else
              docker tag "$prefix/mindbliss-$service:$IMAGE_TAG" "mindbliss/app-platform-$service:test-20261024"
            fi
          done
      - name: Test the exact release candidates before publishing
        run: |
          set -euo pipefail
          docker build -f deploy/docker-qa/Dockerfile.postgres -t mindbliss/rds-postgres-test:20261024 .
          node deploy/digitalocean/test-local.mjs --synthetic-docker
          node deploy/portable/test-backup.mjs --synthetic-docker --vanilla-postgres
      - name: Push tested candidates and verify immutable remote references
        run: |
          set -euo pipefail
          for service in api engine payments withdrawals backup; do
            docker push "registry.digitalocean.com/$DOCR_REGISTRY/mindbliss-$service:$IMAGE_TAG"
          done
          node deploy/digitalocean/release.mjs lock --registry "$DOCR_REGISTRY" \
            --names api,engine,payments,withdrawals,backup --output backend-image-lock.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-image-lock
          path: backend-image-lock.json
          if-no-files-found: error
          retention-days: 30
