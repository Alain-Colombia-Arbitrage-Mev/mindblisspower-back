name: postgres-rds
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, staging]
permissions:
  contents: read
concurrency:
  group: postgres-rds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres:
    name: backend-postgres-api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: "24"}
      - run: docker build --target test -t mindbliss/rds-api-test app
      - name: Workflow safety policy
        run: docker run --rm --network none -v "$PWD:/repo:ro" -w /repo mindbliss/rds-api-test bun test deploy/digitalocean/ci-policy.test.ts
      - run: docker build -f deploy/docker-qa/Dockerfile.postgres -t mindbliss/rds-postgres-test:20261024 .
      - name: PostgreSQL contracts and all API persistence tests
        run: node deploy/rds/test-postgres.mjs --synthetic-docker --with-api-tests
      - run: node --test deploy/portable/manage.test.mjs deploy/portable/release-policy.test.mjs
      - name: API unit, toolchain and synthetic HTTP security checks
        run: docker run --rm --network none mindbliss/rds-api-test
      - name: Better Auth, identity migration and concurrent OTP contracts on disposable PostgreSQL
        run: node app/src/modules/identity/test-postgres.mjs --synthetic-docker
      - run: docker run --rm mindbliss/rds-api-test bun audit
  go:
    name: backend-go-race
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: vp-engine/go.mod
          cache-dependency-path: vp-engine/go.sum
      - run: go mod verify
        working-directory: vp-engine
      - run: go vet ./...
        working-directory: vp-engine
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -scan=package -test ./...
        working-directory: vp-engine
      - run: go test -race -p 2 -count=1 -timeout=20m ./...
        working-directory: vp-engine
        env:
          AWS_EC2_METADATA_DISABLED: "true"
  terraform:
    if: vars.DEPLOYMENT_PROVIDER == 'alibaba'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/alibaba/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with: {terraform_version: "1.17.0", terraform_wrapper: false}
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      - run: terraform test
