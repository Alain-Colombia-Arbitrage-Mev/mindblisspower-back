name: Dependency security
on:
  pull_request:
  push:
    branches: [main, staging, feature/security-dependencies-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bun-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.4" }
      - run: bun install --frozen-lockfile
        working-directory: app
      - run: bun audit
        working-directory: app
      - run: bun run typecheck
        working-directory: app
      - run: bun run test:toolchain
        working-directory: app
  go-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: vp-engine/go.mod
          cache-dependency-path: vp-engine/go.sum
      - run: go mod verify
        working-directory: vp-engine
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -scan=package -test ./...
        working-directory: vp-engine
      - name: Reject unmaintained OpenPGP imports
        working-directory: vp-engine
        run: |
          go list -deps -test ./... > "$RUNNER_TEMP/go-deps.txt"
          if grep -Eq '^golang.org/x/crypto/openpgp(/|$)' "$RUNNER_TEMP/go-deps.txt"; then
            echo 'Unmaintained OpenPGP must not be imported.'
            exit 1
          fi
