name: Dependency security
on:
  pull_request:
  push:
    branches: [main, staging, feature/security-dependencies-20261024]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  bun-audit:
    name: backend-bun-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.4" }
      - run: bun install --frozen-lockfile
        working-directory: app
      - run: bun audit
        working-directory: app
      - run: bun run typecheck
        working-directory: app
      - run: bun run test:toolchain
        working-directory: app
  go-audit:
    name: backend-go-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: vp-engine/go.mod
          cache-dependency-path: vp-engine/go.sum
      - run: go mod verify
        working-directory: vp-engine
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -scan=package -test ./...
        working-directory: vp-engine
      - name: Reject unmaintained OpenPGP imports
        working-directory: vp-engine
        run: |
          go list -deps -test ./... > "$RUNNER_TEMP/go-deps.txt"
          if grep -Eq '^golang.org/x/crypto/openpgp(/|$)' "$RUNNER_TEMP/go-deps.txt"; then
            echo 'Unmaintained OpenPGP must not be imported.'
            exit 1
          fi
