services:
  api:
    image: ${REGISTRY}/vp/api:${IMAGE_TAG}
    restart: unless-stopped
    network_mode: host
    env_file: [/run/vicionpower/api.env]
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 15s
    stop_grace_period: 20s
  vp-engine:
    image: ${REGISTRY}/vp/vp-engine:${IMAGE_TAG}
    restart: unless-stopped
    network_mode: host
    user: "0"
    env_file: [/run/vicionpower/vp-engine.env]
    # El cron del cierre binario (lunes 02:00) corre SOLO en server1. Como el env
    # de vp-engine se rinde desde el MISMO path SSM para ambos boxes, este override
    # por-compose (precede al env_file, solo en este WORKER) evita el doble
    # scheduler de forma permanente. server1.yml NO lo lleva ⇒ conserva el ciclo.
    environment:
      BONUS_ENGINE_BINARY_CYCLE_ENABLED: "false"
    volumes:
      - /etc/vp-engine/tls:/etc/vp-engine/tls:ro
    stop_grace_period: 20s
  # --- Soporte RAG (KB): qdrant/falkordb mantienen imagen fija; los servicios Go siguen IMAGE_TAG.
  qdrant:
    image: qdrant/qdrant:v1.15.1
    restart: unless-stopped
    network_mode: host  # QDRANT__SERVICE__HOST=127.0.0.1 en su env ⇒ solo loopback
    env_file: [/run/vicionpower/qdrant.env]
    volumes:
      - /opt/vicion/qdrant:/qdrant/storage
    stop_grace_period: 20s
  falkordb:
    image: falkordb/falkordb-server:latest
    restart: unless-stopped
    network_mode: host  # REDIS_ARGS debe fijar --bind 127.0.0.1 --port 6380
    env_file: [/run/vicionpower/falkordb.env]
    volumes:
      - /opt/vicion/falkordb:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${FALKORDB_PASSWORD}\" redis-cli -p 6380 ping | grep PONG"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    stop_grace_period: 20s
  vp-support:
    image: ${REGISTRY}/vp/vp-support:${IMAGE_TAG}
    restart: unless-stopped
    network_mode: host  # bind 0.0.0.0:9096; el SG mantiene el puerto cerrado al público
    env_file: [/run/vicionpower/vp-support.env]
    depends_on: [qdrant, falkordb]
    stop_grace_period: 20s
  vp-voice-agent:
    image: ${REGISTRY}/vp/vp-voice-agent:${IMAGE_TAG}
    restart: unless-stopped
    network_mode: host  # Caddy expone solo /api/support/voice/pipecat/*; puerto 7860 queda privado por SG.
    env_file: [/run/vicionpower/vp-voice-agent.env]
    environment:
      PIPECAT_HOST: 0.0.0.0
      PIPECAT_PORT: "7860"
      PIPECAT_TRANSPORT: twilio
      PIPECAT_PROXY_HOST: app.mindblisspower.com
    depends_on: [vp-support]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:7860/status', timeout=2); sys.exit(0 if r.status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 20s
  vp-kb-indexer:
    image: ${REGISTRY}/vp/vp-kb-indexer:${IMAGE_TAG}
    restart: unless-stopped
    network_mode: host
    env_file: [/run/vicionpower/vp-kb-indexer.env]
    depends_on: [qdrant, falkordb]
    stop_grace_period: 20s
