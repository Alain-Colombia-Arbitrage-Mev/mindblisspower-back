# Compose de STAGING — corre en la EC2 i-0f7f6c73503537d73 (t4g.small).
# api + vp-payments + vp-engine con network_mode: host, así llegan al Postgres
# de dev/staging (contenedor vp-dev-db, 127.0.0.1:55432) vía el DSN del env-file.
# El env de cada servicio viene de SSM /vicionpower/staging/<svc>/ (lo materializa
# remote-deploy.sh en /run/vicionpower/<svc>.env). Stripe en modo TEST; ciclo
# binario apagado; Cognito pool de staging.
services:
  api:
    image: ${REGISTRY}/vp/api:${IMAGE_TAG}
    restart: unless-stopped
    network_mode: host
    env_file: [/run/vicionpower/api.env]
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 15s
    stop_grace_period: 20s
  vp-payments:
    image: ${REGISTRY}/vp/vp-payments:${IMAGE_TAG}
    restart: unless-stopped
    network_mode: host
    env_file: [/run/vicionpower/vp-payments.env]
    stop_grace_period: 20s
  vp-engine:
    image: ${REGISTRY}/vp/vp-engine:${IMAGE_TAG}
    restart: unless-stopped
    network_mode: host
    env_file: [/run/vicionpower/vp-engine.env]
    stop_grace_period: 20s
